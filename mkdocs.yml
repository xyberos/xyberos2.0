  # is what makes them correct on GitHub, and a documentation build resolves links against its own
  # source directory. Publishing a copy would mean maintaining a second set of links.
  - About:
      - The content plan: "https://github.com/xyberos/xyberos2.0/blob/master/site/site.md"
