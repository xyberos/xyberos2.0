# The documentation site.
#
# Two directories are generated and are not committed: `roadmap.md`, and everything under
# `reference/` (a copy of the repository's `docs/`, made by site/scripts/reference.py). `docs_dir`
# cannot therefore be built by a bare `mkdocs build`; `python site/scripts/build.py` is the entry
# point, and it is what CI runs.
#
# `site_dir` is `build/site` rather than MkDocs's default `site/`, because `site/` is this file's
# source directory: the default would write the built site on top of the pages it is built from.

site_name: Xyberos
site_description: A composable Python application runtime — tutorials, guides, and reference
# The release URL. A preview publishes under its own URL by setting `SITE_URL`, which is how the same
# build serves `https://xyberos.github.io/xyberos2.0/` before the release moves it to this one.
site_url: !ENV [SITE_URL, "https://docs.xyberos.com/"]
repo_url: https://github.com/xyberos/xyberos2.0
repo_name: xyberos/xyberos2.0
edit_uri: edit/master/site/

docs_dir: site
site_dir: build/site

# The two plan documents live in this directory but are not part of the published site: their links
# are repository-relative, which is what makes them correct where they are read, and a documentation
# build resolves links against its own source directory. They are linked from the navigation instead.
exclude_docs: |
  site.md
  implementation.md

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.tabs.link
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  # Lesson code is included from the file the test suite runs, so a page cannot disagree with the
  # code. `check_paths` turns a missing include into a build failure rather than a silent gap.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

# A page claims its code with `<!-- snippet: path -->`, which is the form `tests/site` reads; MkDocs
# only understands `--8<--`, so this hook is what turns the claim into rendered code.
hooks:
  - site/scripts/snippets_hook.py

