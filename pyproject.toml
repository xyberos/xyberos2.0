[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xyberos-minimal"
version = "2.0.0"
description = "Minimal Xyberos 2.0 Core and HTTP Adapter Architecture"
requires-python = ">=3.10"
dependencies = [
    "starlette>=0.35.0",
    "uvicorn>=0.25.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2,<4",
]

[tool.setuptools.packages.find]
include = ["xyberos*"]