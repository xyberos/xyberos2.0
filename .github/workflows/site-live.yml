name: Live site appendices

# Opt-in, and never a gate. The site's lessons run offline — that is what makes their output
# verifiable — and the appendices document real services instead. This workflow exists so those
# appendices are not untested code; it is separate so that a missing model service can never fail a
# pull request, which is the same property `tests/ai/test_live_ollama.py` already keeps by being
# skipped unless XYBEROS_OLLAMA_LIVE is set.

on:
  workflow_dispatch:

jobs:
  live-appendices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,http,database,ollama]"
      - run: python site/scripts/build.py
      - run: python -m pytest tests/site/test_live_appendices.py -v
        env:
          # A service and a pulled model are prerequisites of this job, not of the repository.
          XYBEROS_OLLAMA_LIVE: "1"
