name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: xyberos_test
          POSTGRES_USER: xyberos
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xyberos -d xyberos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      XYBEROS_TEST_POSTGRES_DSN: postgresql://xyberos:ci-only-password@localhost:5432/xyberos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Update installer security fixes
        run: python -m pip install --upgrade "pip>=26.2"
      - name: Install package and CI tools
        run: python -m pip install -e ".[postgres,p2p-crypto,dev]"
      - name: Lint
        run: >-
          ruff check
          xyberos/http/health.py
          xyberos/subsystems/database/migrations.py
          apps/example_crud_app/app.py
          apps/example_crud_app/migrate.py
          tests/test_phase2_app.py
          tests/test_providers.py
      - name: Type-check new deployment primitives
        run: >-
          pyright --pythonversion 3.10
          xyberos/http/health.py
          xyberos/subsystems/database/migrations.py
          apps/example_crud_app/app.py
          apps/example_crud_app/migrate.py
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Audit Python dependencies
        run: pip-audit

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel and source distribution
        run: |
          python -m pip install "build>=1,<2"
          python -m build
      - name: Install wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/xyberos-wheel-env"
          "$RUNNER_TEMP/xyberos-wheel-env/bin/python" -m pip install dist/*.whl
      - name: Smoke-test installed public API outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/xyberos-wheel-env/bin/python" -c '
          from importlib.metadata import version
          import xyberos
          from xyberos import http, kernel, providers, subsystems
          from xyberos.http.health import create_health_routes
          from xyberos.http.middleware import (
              IdentityResolver,
              KernelAdmissionMiddleware,
              XyberosContextMiddleware,
          )
          from xyberos.kernel import (
              AuthenticatedIdentity,
              Capability,
              ExecutionContext,
              PolicyEngine,
              XyberosKernel,
          )
          from xyberos.subsystems.database import (
              Database,
              DatabaseSubsystem,
              SchemaMigrator,
          )

          assert xyberos.__version__ == version("xyberos-minimal")
          assert all((kernel, http, providers, subsystems))
          assert create_health_routes is not None
          assert all(
              (
                  IdentityResolver,
                  KernelAdmissionMiddleware,
                  XyberosContextMiddleware,
              )
          )
          assert all(
              (
                  AuthenticatedIdentity,
                  Capability,
                  ExecutionContext,
                  PolicyEngine,
                  XyberosKernel,
              )
          )
          assert all((Database, DatabaseSubsystem, SchemaMigrator))
          '
