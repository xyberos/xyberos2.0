name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,http,database]"
      - run: python -m pip install --no-deps -e tests/fixtures/metrics_plugin
      - run: python -m pytest
      - run: ruff check src tests examples
      - run: ruff format --check src tests examples
      - run: mypy
      - run: python -m build

  optional-installation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [core, http, database, ollama, durable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - if: matrix.extra != 'core'
        run: python -m pip install -e ".[${{ matrix.extra }}]"
      - if: matrix.extra == 'core'
        run: python -m pip install -e .
      - run: python -c "import xyberos; print(xyberos.__version__)"
      - if: matrix.extra == 'core'
        run: python -c "import sys, xyberos; assert not [m for m in ('starlette', 'sqlalchemy', 'aiosqlite', 'alembic', 'httpx') if m in sys.modules], 'core imported an optional capability'"