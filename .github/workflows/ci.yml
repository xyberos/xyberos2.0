name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,http,database]"
      - run: python -m pip install --no-deps -e tests/fixtures/metrics_plugin
      - run: python -m pytest
      - run: ruff check src tests examples
      - run: ruff format --check src tests examples
      - run: mypy
      - run: python -m build

  optional-installation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [core, http, database, ollama, durable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - if: matrix.extra != 'core'
        run: python -m pip install -e ".[${{ matrix.extra }}]"
      - if: matrix.extra == 'core'
        run: python -m pip install -e .
      - run: python -c "import xyberos; print(xyberos.__version__)"
      - if: matrix.extra == 'core'
        run: python -c "import sys, xyberos; assert not [m for m in ('starlette', 'sqlalchemy', 'aiosqlite', 'alembic', 'httpx') if m in sys.modules], 'core imported an optional capability'"
      - if: matrix.extra == 'core'
        run: |
          python - <<'PY'
          import asyncio
          import sys

          from xyberos.ai import AIFacade, ChatRequest, FakeModelProvider, Message, ModelReply

          assert "httpx" not in sys.modules, "the AI facade imported an SDK"


          async def main() -> None:
              facade = AIFacade(FakeModelProvider([ModelReply.ok("hello")]))
              request = ChatRequest(messages=(Message.user("hi"),), model="m")
              response = await facade.chat(request)
              assert response.message.content == "hello", response.message.content
              print("AI facade usable with no extras installed")


          asyncio.run(main())
          PY
      - if: matrix.extra == 'core'
        run: |
          python - <<'PY'
          import asyncio

          from xyberos import Retry, Workflow
          from xyberos.execution import FakeExternalService, ManualClock, Reply, WorkflowExecutor


          async def main() -> None:
              clock = ManualClock()
              service = FakeExternalService([Reply.rate_limited(), Reply.ok("done")], clock=clock)

              async def fetch(value, context):
                  return await service.call()

              workflow = Workflow("smoke").step("fetch", fetch, retry=Retry(max_attempts=2))
              task = asyncio.ensure_future(
                  workflow.run(executor=WorkflowExecutor(clock=clock))
              )
              result = await clock.drive(task)

              assert result.value == "done", result.value
              assert service.calls == 2, service.calls
              print("workflow engine usable with no extras installed")


          asyncio.run(main())
          PY
      - if: matrix.extra == 'ollama'
        run: |
          python - <<'PY'
          import asyncio

          import httpx

          from xyberos.ai import ChatRequest, Message
          from xyberos.ai.ollama import OllamaProvider, OllamaSettings


          def handler(request: httpx.Request) -> httpx.Response:
              return httpx.Response(
                  200,
                  json={
                      "model": "smoke",
                      "message": {"role": "assistant", "content": "ok"},
                      "done": True,
                  },
              )


          async def main() -> None:
              async with httpx.AsyncClient(
                  transport=httpx.MockTransport(handler), base_url="http://127.0.0.1:11434"
              ) as client:
                  provider = OllamaProvider(OllamaSettings(model="smoke"), client=client)
                  response = await provider.chat(
                      ChatRequest(messages=(Message.user("hi"),), model="smoke")
                  )
                  assert response.message.content == "ok", response.message.content


          asyncio.run(main())
          print("ollama adapter importable and drivable without a service")
          PY
      - if: matrix.extra == 'durable'
        run: |
          python - <<'PY'
          import asyncio
          import tempfile
          import warnings
          from pathlib import Path

          from xyberos import Workflow
          from xyberos.durable import (
              ActivityPolicy,
              ExecutionStatus,
              JournalSettings,
              JournalStore,
              open_journal,
          )
          from xyberos.durable.worker import DurableWorker, WorkerSettings


          async def step(value, context):
              return "done"


          async def main() -> None:
              with tempfile.TemporaryDirectory() as temporary:
                  with warnings.catch_warnings(record=True) as caught:
                      warnings.simplefilter("always")
                      journal = await open_journal(
                          JournalSettings(path=Path(temporary) / "journal.db")
                      )
                  assert any(w.category.__name__ == "ExperimentalWarning" for w in caught), caught

                  store = JournalStore(journal)
                  workflow = Workflow("smoke", version="1").step("run", step)
                  await store.submit(workflow, input=None)

                  worker = DurableWorker(
                      store,
                      {"smoke:1": workflow},
                      activities={"run": ActivityPolicy()},
                      settings=WorkerSettings(owner="ci"),
                  )
                  while await worker.run_once() is not None:
                      pass

                  view = await store.inspect((await store.list_executions())[0].execution_id)
                  assert view.status is ExecutionStatus.COMPLETED, view.status
                  assert view.result == {"run": "done"}, view.result
                  await journal.aclose()
              print("durable executor usable with the durable extra")


          asyncio.run(main())
          PY