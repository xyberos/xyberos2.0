# Publish the documentation site to GitHub Pages.
#
# This is the *preview* URL, not the release: `https://xyberos.github.io/xyberos2.0/`. The release
# publishes to `https://docs.xyberos.com`, which currently serves the 1.x documentation. The order is
# preview first, then the 1.x documentation moves to that line's repository and this line takes the
# domain — see docs/release.md precondition 4, which records it.
#
# A preview is allowed to contain pages the release gate refuses: `--check` validates the pages, and
# only `--release` requires every one of them to be finished. That is why this URL ships the two
# sections that are still `planned`, and why the roadmap page reports them.
#
# The build is the same one CI runs (`python site/scripts/build.py`): the generated pages first, then
# `mkdocs build --strict`, then the check that no page kept an unrendered snippet marker. A publish that
# cannot build strictly does not happen, so a broken page never reaches the URL.
#
# A publish needs one thing this workflow cannot grant itself: a Pages site. Until it exists the tests
# and the build still run, and the check in the deploy job names the setting that is missing.

name: site

on:
  # Manual, so a publish is a decision someone made rather than a side effect of a merge.
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "docs/**"
      - "examples/**"
      - "tests/site/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - ".github/workflows/site.yml"

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time, and the newest wins: a queue of superseded builds is a queue of URLs nobody
# wants.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The URL is derived rather than read from `actions/configure-pages`, because that action fails
      # when the repository has no Pages site — and a publish that has not been switched on yet still
      # owes everyone the tests and the strict build. Only the deploy below needs the setting.
      - name: Work out the Pages URL
        id: pages
        run: |
          echo "base_url=https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
      - run: python -m pip install --upgrade pip
      # The site's own dependencies: mkdocs-material for the theme, and the extras the lessons import.
      - run: python -m pip install -e ".[dev,http,database]"
      - run: python -m pip install --no-deps -e tests/fixtures/metrics_plugin
      # Generated pages first: the roadmap and the reference are not committed, and the suite checks the
      # links into them and the rendered reference against `docs/`. `--check` also refuses a `draft`
      # lesson in the navigation.
      - name: Build the site
        run: python site/scripts/build.py --check --site-url "${{ steps.pages.outputs.base_url }}/"
      # The lessons are the site's content, so the suite runs before the artifact is uploaded: a page
      # that fails its own claims is not published.
      - run: python -m pytest tests/site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The one thing this repository cannot do for itself. Without it `deploy-pages` fails on the API
      # rather than on anything a reader can act on, so the check says which setting is missing.
      - name: Check that Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" > /dev/null 2>&1; then
            exit 0
          fi
          echo "::error::$GITHUB_REPOSITORY has no GitHub Pages site, so there is nowhere to deploy to."
          echo "::error::Set Settings -> Pages -> Source: GitHub Actions, then re-run this workflow."
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
